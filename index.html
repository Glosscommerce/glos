<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#092B52">
  <meta name="description" content="CORRECTGLOSS — correcteur de mémoire et documents.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>CORRECTGLOSS</title>
  <style>
    :root { color-scheme: light; --navy:#092B52; --teal:#13B8A6; --gold:#F6BE32; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#102A43; background:linear-gradient(150deg,#eaf8fa,#f8fbff 55%,#fff7df); display:grid; place-items:center; padding:20px; }
    main { width:min(100%,440px); background:rgba(255,255,255,.96); border:1px solid #d8e7ed; border-radius:26px; box-shadow:0 20px 60px rgba(9,43,82,.15); padding:30px 24px 26px; text-align:center; }
    .logo { width:112px; height:112px; object-fit:contain; border-radius:25px; margin-bottom:12px; }
    h1 { margin:4px 0 8px; color:var(--navy); font-size:clamp(25px,7vw,34px); letter-spacing:.5px; }
    .rule { width:70px; height:4px; border-radius:5px; background:linear-gradient(90deg,var(--teal),var(--gold)); margin:15px auto 18px; }
    p { line-height:1.6; color:#526779; margin:0 0 22px; }
    .launch { display:block; text-decoration:none; background:var(--navy); color:white; font-weight:700; padding:15px 18px; border-radius:14px; box-shadow:0 7px 18px rgba(9,43,82,.18); }
    .launch:active { transform:translateY(1px); }
    .features { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:19px 0 0; }
    .pill { color:#0e746c; background:#e3faf6; border:1px solid #bcefe6; padding:7px 10px; border-radius:999px; font-size:12px; font-weight:650; }
    footer { margin-top:21px; font-size:12px; color:#7b8b98; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./icon-512.png" alt="Logo CORRECTGLOSS">
    <h1>CORRECTGLOSS</h1>
    <div class="rule"></div>
    <p>Votre assistant pour corriger, améliorer et valoriser les mémoires et documents.</p>
    <a class="launch" href="https://correctgloss.streamlit.app/">Ouvrir CORRECTGLOSS</a>
    <div class="features"><span class="pill">Corrige</span><span class="pill">Améliore</span><span class="pill">Valorise</span></div>
    <footer>Connexion Internet requise · Application web CORRECTGLOSS</footer>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
