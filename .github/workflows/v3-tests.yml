name: CORRECTGLOSS V3 tests

on:
  push:
    branches:
      - correctgloss-v3-free-test
  pull_request:
    branches:
      - main

jobs:
  v3-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check V3 and shared engine Python syntax
        run: |
          python -m py_compile \
            v3_app.py \
            v3_free/ai_provider.py \
            v3_free/assistant.py \
            v3_free/long_writer.py \
            v3_free/document_export.py \
            correction_engine.py \
            research_engine.py \
            export_engine.py
      - name: Run all automated tests
        run: python -m unittest discover -s tests -v
