name: CORRECTGLOSS V2 tests

on:
  push:
    branches:
      - correctgloss-v2-test
  pull_request:
    branches:
      - main

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py correction_engine.py export_engine.py
      - name: Run V2 tests
        run: python -m unittest discover -s tests -v
